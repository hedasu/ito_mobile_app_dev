<script>function setMode(mode){const badge=document.getElementById('record-badge');const divider=document.getElementById('record-divider');const detail=document.getElementById('record-detail');const tabRecord=document.getElementById('tab-record');const tabNormal=document.getElementById('tab-normal');if(mode==='record'){if(badge)badge.style.display='flex';if(divider)divider.style.display='block';if(detail)detail.style.display='flex';if(tabRecord){tabRecord.className='px-3 py-1 rounded-full font-semibold transition-all duration-200 bg-[#A5BBA6] text-[#171D1A] flex items-center gap-1 shadow-sm';}if(tabNormal){tabNormal.className='px-3 py-1 rounded-full font-medium transition-all duration-200 text-[#8B9A8F] hover:text-[#F1F4EF] flex items-center gap-1';}}else{if(badge)badge.style.display='none';if(divider)divider.style.display='none';if(detail)detail.style.display='none';if(tabRecord){tabRecord.className='px-3 py-1 rounded-full font-medium transition-all duration-200 text-[#8B9A8F] hover:text-[#F1F4EF] flex items-center gap-1';}if(tabNormal){tabNormal.className='px-3 py-1 rounded-full font-semibold transition-all duration-200 bg-[#A5BBA6] text-[#171D1A] flex items-center gap-1 shadow-sm';}}}</script>
