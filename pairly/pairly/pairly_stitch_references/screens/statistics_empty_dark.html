<body class="bg-surface-container-low text-on-surface antialiased flex justify-center items-start min-h-screen">
<div class="w-[390px] h-[844px] bg-[#171D1A] relative flex flex-col justify-between overflow-hidden select-none">
<!-- Ambient subtle background glow -->
<div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[340px] h-[340px] rounded-full bg-primary-container/5 blur-3xl pointer-events-none"></div>
<!-- 1. Top Section: iOS Status Bar + Header -->
<header class="w-full pt-3 px-6 z-10 flex-shrink-0">
<!-- iOS Status Bar -->
<div class="flex justify-between items-center text-xs font-semibold tracking-tight text-[#F1F4EF] h-6 px-1">
<span>09:41</span>
<div class="flex items-center space-x-1.5">
<span class="material-symbols-outlined text-[15px]" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[15px]" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[17px]" data-icon="battery_full">battery_full</span>
</div>
</div>
<!-- App Bar -->
<div class="flex items-center justify-between h-14 mt-1">
<button aria-label="Geri" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-[#F1F4EF] hover:bg-[#252E28] active:scale-95 transition-all duration-150" type="button">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-semibold text-[#F1F4EF] tracking-tight">
          İstatistikler
        </h1>
<!-- Balanced spacer -->
<div aria-hidden="true" class="w-10 h-10 -mr-2"></div>
</div>
</header>
<!-- 2. Central Content: Cards Illustration + Copy + CTA -->
<main class="flex-1 flex flex-col items-center justify-center px-6 relative z-10 -mt-6">
<!-- Minimal Memory Cards Illustration -->
<div class="relative w-48 h-48 flex items-center justify-center mb-8">
<!-- Background Tilted Card -->
<div class="absolute w-32 h-44 rounded-2xl bg-[#1E2521] border border-[#3B483F] -rotate-12 translate-x-[-12px] translate-y-[-4px] flex flex-col items-center justify-center shadow-lg transition-transform duration-300">
<!-- Geometric Nordic Minimal Pattern -->
<div class="grid grid-cols-2 gap-3 opacity-25">
<span class="w-2.5 h-2.5 rounded-full bg-[#A5BBA6]"></span>
<span class="w-2.5 h-2.5 rounded-full border border-[#A5BBA6]"></span>
<span class="w-2.5 h-2.5 rounded-full border border-[#A5BBA6]"></span>
<span class="w-2.5 h-2.5 rounded-full bg-[#A5BBA6]"></span>
</div>
</div>
<!-- Foreground Tilted Card with Glow and Badge -->
<div class="absolute w-32 h-44 rounded-2xl bg-[#252E28] border border-[#3B483F] rotate-6 translate-x-[10px] translate-y-[6px] flex flex-col items-center justify-between p-4 shadow-2xl transition-transform duration-300">
<!-- Subtle top corner dots -->
<div class="w-full flex justify-between items-center opacity-40">
<span class="w-1.5 h-1.5 rounded-full bg-[#A5BBA6]"></span>
<span class="w-1.5 h-1.5 rounded-full bg-[#A5BBA6]"></span>
</div>
<!-- Central Badge with minimalist sage icon -->
<div class="w-14 h-14 rounded-full bg-[#1A221D] border border-[#3B483F] flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-[#A5BBA6] text-2xl" data-icon="psychology">psychology</span>
</div>
<!-- Subtle bottom corner dots -->
<div class="w-full flex justify-between items-center opacity-40">
<span class="w-1.5 h-1.5 rounded-full bg-[#A5BBA6]"></span>
<span class="w-1.5 h-1.5 rounded-full bg-[#A5BBA6]"></span>
</div>
</div>
<!-- Ambient aura beneath foreground card -->
<div class="absolute w-24 h-24 rounded-full bg-[#A5BBA6]/10 blur-xl pointer-events-none"></div>
</div>
<!-- Copy Block -->
<div class="text-center space-y-2 mb-10">
<h2 class="font-headline-md text-headline-md font-semibold text-[#F1F4EF] tracking-tight">
          Henüz oyun kaydın yok
        </h2>
<p class="font-body-md text-body-md text-[#A0AAA2] max-w-[280px] mx-auto leading-relaxed">

        </p>
</div>

<button class="w-full max-w-[320px] h-14 rounded-full bg-[#A5BBA6] text-[#171D1A] font-label-lg text-label-lg font-semibold flex items-center justify-center gap-2 shadow-sm hover:scale-[1.02] active:scale-[0.98] transition-all duration-150" type="button">
