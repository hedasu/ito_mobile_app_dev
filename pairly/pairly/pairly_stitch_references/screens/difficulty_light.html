<script>
    document.addEventListener('DOMContentLoaded', () => {
      const labels = document.querySelectorAll('label');
      labels.forEach(label => {
        label.addEventListener('click', () => {
          labels.forEach(l => {
            // Remove active styles
            l.classList.remove('border-2', 'border-primary-container', 'bg-surface-container-low', 'shadow-[0_4px_16px_rgba(90,109,94,0.12)]');
            l.classList.add('border', 'border-outline-variant', 'bg-surface-container-lowest');
            const radioContainer = l.querySelector('div:last-child');
            if (radioContainer) {
              radioContainer.className = 'w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center group-hover:border-outline transition-colors';
              radioContainer.innerHTML = '<input type="radio" name="difficulty" class="sr-only">';
            }
          });

          // Apply active styling to selected
          label.classList.remove('border', 'border-outline-variant', 'bg-surface-container-lowest');
          label.classList.add('border-2', 'border-primary-container', 'bg-surface-container-low', 'shadow-[0_4px_16px_rgba(90,109,94,0.12)]');
          const activeRadio = label.querySelector('div:last-child');
          if (activeRadio) {
            activeRadio.className = 'w-5 h-5 rounded-full bg-primary-container flex items-center justify-center text-on-primary shadow-xs';
            activeRadio.innerHTML = '<input type="radio" name="difficulty" checked class="sr-only"><span class="material-symbols-outlined text-[14px]" style="font-variation-settings: \'FILL\' 1;">check</span>';
          }
        });
      });
    });
